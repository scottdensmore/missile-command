name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.1.0; leave blank to detect from CHANGELOG / commits)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare-release:
    name: Determine Version & Prepare Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Release Trigger & Version
        id: check
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"
          INPUT_VERSION="${{ inputs.version }}"

          echo "Event: ${EVENT_NAME}"
          echo "Ref: ${REF}"
          echo "Input Version: ${INPUT_VERSION}"

          # Ensure tags are available locally
          git fetch --tags --force 2>/dev/null || true

          SHOULD_RELEASE="false"
          RELEASE_TAG=""
          VERSION=""

          if [[ "${REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${REF#refs/tags/}"
            VERSION="${RELEASE_TAG#v}"
            SHOULD_RELEASE="true"
            echo "Direct tag push detected: ${RELEASE_TAG}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            RELEASE_TAG="${INPUT_VERSION}"
            [[ "${RELEASE_TAG}" != v* ]] && RELEASE_TAG="v${RELEASE_TAG}"
            VERSION="${RELEASE_TAG#v}"
            SHOULD_RELEASE="true"
            echo "Workflow dispatch with explicit version detected: ${RELEASE_TAG}"
          else
            # Triggered on main branch push or workflow_dispatch without explicit version
            # First check if CHANGELOG.md has an unreleased version header: e.g. ## [1.1.0]
            CHANGELOG_VERSION=$(grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -n 1 | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/' || true)

            if [ -n "${CHANGELOG_VERSION}" ]; then
              CANDIDATE_TAG="v${CHANGELOG_VERSION}"
              if ! git rev-parse -q --verify "refs/tags/${CANDIDATE_TAG}" >/dev/null 2>&1; then
                echo "Found untagged version ${CANDIDATE_TAG} in CHANGELOG.md"
                RELEASE_TAG="${CANDIDATE_TAG}"
                VERSION="${CHANGELOG_VERSION}"
                SHOULD_RELEASE="true"
              fi
            fi

            # If CHANGELOG top version is already tagged, inspect commits since the latest tag
            if [ "${SHOULD_RELEASE}" != "true" ]; then
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -z "${LATEST_TAG}" ]; then
                RELEASE_TAG="v1.0.0"
                VERSION="1.0.0"
                SHOULD_RELEASE="true"
                echo "No prior tags found. Initializing release: ${RELEASE_TAG}"
              else
                COMMITS=$(git log "${LATEST_TAG}..HEAD" --oneline 2>/dev/null || echo "")
                if [ -z "${COMMITS}" ]; then
                  echo "No commits since ${LATEST_TAG}. Skipping release."
                  SHOULD_RELEASE="false"
                elif echo "${COMMITS}" | grep -qEi '\[skip ci\]|\[skip release\]'; then
                  echo "Commits specify skip release. Skipping."
                  SHOULD_RELEASE="false"
                else
                  # Semantic version bump calculation
                  CLEAN_VER="${LATEST_TAG#v}"
                  IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_VER}"
                  if echo "${COMMITS}" | grep -qEi '^(feat(\(.*\))?:|.*BREAKING CHANGE)'; then
                    MINOR=$((MINOR + 1))
                    PATCH=0
                  else
                    PATCH=$((PATCH + 1))
                  fi
                  VERSION="${MAJOR}.${MINOR}.${PATCH}"
                  RELEASE_TAG="v${VERSION}"
                  SHOULD_RELEASE="true"
                  echo "Determined next version from commit history: ${RELEASE_TAG}"
                fi
              fi
            fi

            # When on main and release is required, create and push the git tag
            if [ "${SHOULD_RELEASE}" == "true" ]; then
              echo "Tagging ${RELEASE_TAG} on ${GITHUB_SHA}..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
              git push origin "${RELEASE_TAG}"
            fi
          fi

          # Extract version notes from CHANGELOG.md if available
          if [ "${SHOULD_RELEASE}" == "true" ] && [ -f CHANGELOG.md ]; then
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > changelog_notes.txt || true
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Save Release Notes Artifact
        if: steps.check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-notes
          path: changelog_notes.txt
          if-no-files-found: ignore

  build-release:
    name: Build (${{ matrix.name }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            name: Linux AMD64
            os: ubuntu-latest
          - target: macos-universal
            name: macOS Universal
            os: macos-latest
          - target: windows-amd64
            name: Windows AMD64
            os: windows-latest
          - target: wasm
            name: WebAssembly Web Port
            os: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      # -------------------------------------------------------------
      # LINUX AMD64 BUILD & PACKAGE
      # -------------------------------------------------------------
      - name: Build Linux Binary & Archive
        if: matrix.target == 'linux-amd64'
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/missile-command-linux-amd64 .
          
          mkdir -p dist/package-linux/missile-command/icons
          cp dist/missile-command-linux-amd64 dist/package-linux/missile-command/missile-command
          cp README.md LICENSE dist/package-linux/missile-command/
          cp -r assets/icons/* dist/package-linux/missile-command/icons/
          
          tar -czvf dist/missile-command-linux-amd64.tar.gz -C dist/package-linux missile-command
          rm -rf dist/package-linux

      # -------------------------------------------------------------
      # MACOS UNIVERSAL BUILD & APP BUNDLE
      # -------------------------------------------------------------
      - name: Build macOS Binaries & Universal Bundle
        if: matrix.target == 'macos-universal'
        run: |
          mkdir -p dist
          
          # Compile standalone arm64 and amd64
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/missile-command-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/missile-command-darwin-amd64 .
          
          # Merge into Universal 2 binary
          lipo -create -output dist/missile-command-darwin-universal dist/missile-command-darwin-arm64 dist/missile-command-darwin-amd64
          
          # Package into standalone Missile Command.app
          bash scripts/bundle-macos.sh "${{ needs.prepare-release.outputs.version }}" dist/missile-command-darwin-universal
          
          # Create distributable zip archive
          zip -r dist/Missile-Command-macOS-Universal.zip "Missile Command.app"
          rm -f dist/missile-command-darwin-universal

      # -------------------------------------------------------------
      # WINDOWS AMD64 BUILD & PACKAGE
      # -------------------------------------------------------------
      - name: Build Windows Binary & Archive
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          go build -ldflags="-s -w" -o dist/missile-command-windows-amd64.exe .
          
          New-Item -ItemType Directory -Force -Path dist/package-windows
          Copy-Item dist/missile-command-windows-amd64.exe dist/package-windows/missile-command.exe
          Copy-Item assets/icon.ico dist/package-windows/
          Copy-Item README.md dist/package-windows/
          Copy-Item LICENSE dist/package-windows/
          
          Compress-Archive -Path dist/package-windows/* -DestinationPath dist/missile-command-windows-amd64.zip -Force
          Remove-Item -Recurse -Force dist/package-windows

      # -------------------------------------------------------------
      # WEBASSEMBLY BUILD & PACKAGE
      # -------------------------------------------------------------
      - name: Build WebAssembly Package
        if: matrix.target == 'wasm'
        run: |
          mkdir -p dist
          bash scripts/build-wasm.sh
          
          # Package web directory into missile-command-wasm.zip
          (cd web && zip -r ../dist/missile-command-wasm.zip .)

      # -------------------------------------------------------------
      # UPLOAD MATRIX ARTIFACTS
      # -------------------------------------------------------------
      - name: Upload Matrix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-assets-*
          merge-multiple: true
          path: dist

      - name: Download Release Notes Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: changelog-notes
          path: .

      - name: Generate SHA-256 Checksums & Prepare Release Notes
        run: |
          cd dist
          rm -f checksums.txt changelog_notes.txt
          sha256sum * > checksums.txt
          cat checksums.txt
          cd ..
          
          if [ -s changelog_notes.txt ]; then
            echo "HAS_NOTES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_NOTES=false" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Missile Command ${{ needs.prepare-release.outputs.tag }}
          body_path: ${{ env.HAS_NOTES == 'true' && 'changelog_notes.txt' || '' }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
