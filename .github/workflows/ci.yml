name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Install Linux Audio, Graphics & Virtual Display Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev xvfb

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit Tests (Linux with xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -v -race ./...

      - name: Run Unit Tests (macOS)
        if: runner.os == 'macOS'
        run: go test -v -race ./...

      - name: Run Unit Tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v ./...

      - name: Build Binary
        run: go build -v -o missile-command${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Build WebAssembly Target
        if: runner.os == 'Linux'
        run: GOOS=js GOARCH=wasm go build -v -o /dev/null .
