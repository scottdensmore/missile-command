name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Linux Audio & Graphics Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxi-dev libxcursor-dev libx11-dev libasound2-dev pkg-config

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ runner.os == 'Linux' && 'wasm32-unknown-unknown' || '' }}

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --bin missile-command

      - name: Build WebAssembly Target
        if: runner.os == 'Linux'
        run: cargo build --release --target wasm32-unknown-unknown --bin missile-command
